<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>elevator-sim — run viewer (dev)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1319;
        --panel: #171d26;
        --edge: #2b3542;
        --text: #e6edf3;
        --dim: #7d8896;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        flex-direction: column;
      }
      header, footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--edge);
      }
      footer { border-bottom: 0; border-top: 1px solid var(--edge); }
      select, input, button {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 4px 8px;
      }
      button { cursor: pointer; }
      button:focus-visible, select:focus-visible, input:focus-visible {
        outline: 2px solid #4f9ee8;
        outline-offset: 1px;
      }
      label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
      main { flex: 1; min-height: 0; padding: 8px 12px; }
      canvas { width: 100%; height: 100%; display: block; }
      #scrub { flex: 1; min-width: 160px; }
      #status { color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <label>building <select id="building"></select></label>
      <label>dispatcher <select id="dispatcher"></select></label>
      <label>seed <input id="seed" size="20" inputmode="numeric" placeholder="random" /></label>
      <button id="run">Run</button>
      <button id="verify" title="re-simulate from this seed and compare the frame sequences">
        Verify replay
      </button>
    </header>

    <main><canvas id="stage"></canvas></main>

    <footer>
      <button id="play-pause">Pause</button>
      <label>speed <select id="speed"></select></label>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="playhead" />
      <span id="status">booting…</span>
    </footer>

    <script type="module" src="/src/dev/main.ts"></script>
  </body>
</html>
