# Dependabot version updates — § D1084 (the CI ruling of 2026-09-25).
#
# Monthly, grouped, and never merged by anything automatic. This repository merges to `main`
# several times a day and every Dependabot pull request is a full CI run, so one grouped pull
# request per ecosystem per month for the minor and patch bumps, and each major on its own so that
# a red one names itself. Nothing here auto-merges and no workflow approves a Dependabot pull
# request: a bump can move a pinned digest or a published figure (§ D196, § D201), and a person or
# the integrator reads it first, folding it into a wave or merging it by hand.
#
# Security updates are a separate switch (Settings, Advanced Security, "Dependabot security
# updates"), which only the owner can turn on; when it is on, those pull requests land in the
# `npm-security` group below.
#
# `rebase-strategy: disabled` because an automatic rebase is a fresh CI run on every merge to
# `main`. Comment `@dependabot rebase` on the pull request when it is about to be read.
#
# The cooldown holds a release back for a week (a month for a major) before a pull request is
# opened for it, which is when a bad release is usually yanked.
#
# Node's own major is ignored in both places it appears. `ci.yml`'s header pins Node to one
# version on purpose and `ciNodeVersion.test.ts` holds every workflow and `.nvmrc` to
# `package.json`'s `engines`, so a Node major is a decision, never a bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "11:17"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Every action in `.github/workflows/` is pinned by full commit SHA with its version in a
  # comment, and this is what keeps those pins current: Dependabot rewrites the SHA and the comment
  # together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "11:17"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The `Dockerfile` at the root builds the API image from `node:26-slim` in two stages.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "11:17"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
