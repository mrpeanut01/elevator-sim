# Code review, in two halves that fail for different reasons.
#
# `ci.yml` answers "does it still work". This answers "should it land", and it is deliberately a
# separate workflow: the suite took ~35 minutes on one leg when this was written (11 at the median
# and 18 at p90 across its legs by 2026-09-25), and a review that only arrives after it has no
# chance of being read before the author has moved on. These jobs finish in
# seconds-to-minutes and post while the suite is still running.
#
# ## The two halves
#
# `gates` is mechanical and blocking. It enforces the CLAUDE.md invariants that have an exact
# checkable form — no global RNG, no wall-clock in `core/`, no `core → viz` dependency, no branch on
# a dispatcher profile id — plus the file-sync duplicates that cost this repository 21 spurious
# failures to diagnose. No secrets, no network, runs on a fork PR.
#
# `claude-review` is judgement and advisory. It reads the diff for the things a regex cannot see:
# whether a control is wired to anything, whether a published number is pinned to the run that
# produced it, whether a new statistical claim has an interval behind it.
#
# Keeping them separate is the point. A missing API key degrades the review to its mechanical half
# and says so; it does not silently pass a pull request nobody read.
#
# ## Since § D1084 (the CI ruling of 2026-09-25)
#
# **`claude review` is opt-in, and a review that did not run shows as skipped rather than green.** It
# was green in 116 of 116 runs in the measured fortnight and read nothing in any of them, because no
# `ANTHROPIC_API_KEY` is set; its key-probe step exported a boolean, skipped the review step and let
# the job pass. That is `RISKS.md` R40 on a required check. The job now runs only when the repository
# variable `CLAUDE_REVIEW` is `true`, and when it runs without a key it fails and says why. A
# skipped job still satisfies a required status check, so no pull request is blocked while the
# ruleset still names it. It runs once per pull request (opened, reopened, ready for review) rather
# than on every push, and it stays advisory.
#
# **`dependency review` is a third job, advisory.** GitHub's dependency-review action compares the
# pull request's manifests with its base through the dependency graph and fails on a new dependency
# with a known vulnerability of high severity or worse. It is free on a public repository and needs
# no checkout. It is not a required check (2-1 in § D1084's swarm); the owner can make it one.
name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A push cancels the previous push's run, and never the run the pull request opened with: that run
# carries the one `claude review` a pull request gets, and a wave's first push usually lands within
# the minute the review takes. So `synchronize` runs share one group and every other event gets its
# own.
concurrency:
  group: review-${{ github.ref }}-${{ github.event.action == 'synchronize' && 'push' || github.event.action || 'dispatch' }}
  cancel-in-progress: true

jobs:
  gates:
    name: invariant gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      # No `npm ci`: the gates read source with `node:fs` and nothing else, so they must not be able
      # to fail for a reason unrelated to the code under review.
      - name: Invariant gates
        run: node scripts/review-gates.mjs

  claude-review:
    name: claude review
    # Opt-in by the repository variable, once per pull request, and never on a fork (a fork's run
    # gets no secrets). Unset, the job is SKIPPED, which GitHub shows grey and which satisfies a
    # required check without claiming a review happened.
    if: >-
      vars.CLAUDE_REVIEW == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # `secrets` is not available in a job-level `if`, so the key is checked here. Turned on and
      # missing its key is a configuration error, and it FAILS rather than passing: the old version
      # of this step skipped the review and let the job go green, which is how a required check
      # reviewed nothing 116 times running. The job is advisory, so the red costs nobody a merge
      # once the ruleset stops requiring it (§ D1084's owner list).
      - name: A key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Claude review is on and has no key::vars.CLAUDE_REVIEW is 'true' and no ANTHROPIC_API_KEY secret is set. Set the secret, or unset the variable to turn the review off."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The prompt is repository-specific on purpose. A generic "review this PR" produces generic
          # findings, and every item below is a defect class this repository has actually shipped —
          # the numbers are from its own DECISIONS.md, not from a checklist.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against `CLAUDE.md`, which is authoritative. The PR branch is
            already checked out. Read `CLAUDE.md` first; it is short and it is the standard.

            The mechanical invariants (no global RNG, no wall-clock in core/, no core→viz import, no
            branch on a dispatcher profile id) are already enforced by `scripts/review-gates.mjs` in
            the `gates` job. Do not re-check them. Look for what a regex cannot see:

            1. THE DEAD INTEGRATION SEAM — this repository's signature defect, shipped ELEVEN times.
               A behaviour that is configurable, unit-tested in isolation, and called from nothing
               shipped passes every other check here. The rule is not "is it reachable?" but "NAME
               THE NON-TEST CALLER". A barrel re-export and a {@link} tag look exactly like a caller
               and are not one. If this PR adds a control, an option or a cost term, find the shipped
               path that reaches it, or say that you could not.

            2. A PUBLISHED NUMBER THAT IS NOT PINNED TO THE RUN THAT PRODUCED IT. Three figures here
               did not reproduce from the code meant to produce them, and § D196/§ D201 cost a whole
               wave: 26 pins were re-pinned to values that were correct on one machine and wrong on
               another, because a pin is a claim about a machine as well as a commit. Flag any new
               exact-value assertion over a floating-point quantity, and any figure quoted in prose
               without a run behind it.

            3. A STATED MECHANISM WITH NO MEASUREMENT. Seven places once asserted that destination
               dispatch does better under access control BECAUSE authorization and optimization
               happen together. Measured, it buys LESS. If this PR says why something performs
               better, either it measured it or it must say it is unmeasured.

            4. STATISTICAL DISCIPLINE. No "better" without a paired-t interval excluding zero; never
               conclude from two overlapping intervals; 50-200 replications, not 10; common random
               numbers across compared alternatives; an effect below the resolution limit is not a
               win even if its interval excludes zero. Energy is an axis, never a score, and
               `workPerServedLegKJ` goes beside any raw energy figure — a configuration that spends
               less by serving fewer people has not saved anything.

            5. A WEAKENED ACCEPTANCE CRITERION. Criteria are raised, never lowered, and a phase is
               done when its criteria pass rather than when the code exists. A test changed to match
               new behaviour, a tolerance widened, a skip added — say so plainly.

            Be specific and actionable: file:line, what is wrong, what would fix it. Say what you
            verified as sound, not only what is wrong. If the PR is fine, say so briefly — do not
            manufacture findings, and do not block on style.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            specific lines. Only post GitHub comments — do not return the review as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  # Advisory, § D1084. Compares this pull request's dependency manifests against its base through the
  # dependency graph (which must be on: Settings, Advanced Security) and fails on a newly introduced
  # dependency with a known vulnerability rated high or critical. No checkout: the action reads the
  # diff from the API. Only on `pull_request`, because it has no base to compare on a dispatch.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
