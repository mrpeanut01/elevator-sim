# The environment this repository's results are true of, made explicit.
#
# This repository pins whole-result digests (`core/src/traffic/*Identity.test.ts`) and published
# statistical figures (`experiments/src/benchmark/published.ts`) as exact values. A pin like that is
# a claim about a *machine* as much as about the code, and until this file existed nothing recorded
# which machine. DECISIONS.md § D196 re-pinned 26 values that failed in one environment; the same 26
# then failed in another, in the opposite direction, with each environment reproducing its own pin
# set exactly (§ D201). Both measurements were correct. Neither was portable, and no gate noticed,
# because there was no CI.
#
# The matrix WAS deliberately two operating systems for exactly that reason, and it is one now.
# DECISIONS.md § D462, on the product owner's call: this product deploys as a Linux container to
# Azure, so a second leg spends runner minutes proving portability to a platform nothing is shipped
# on. The paragraph above is kept rather than deleted because it is still the argument for what was
# given up, and a workflow that quietly lost a leg would read as though it never had one.
#
# What is given up, stated so the next reader does not have to rediscover it:
#
#   * Portability stops being a MEASURED property and goes back to being an assumption. A pin that
#     is environment-dependent is now indistinguishable from a portable one — precisely the status
#     quo ante § D201 describes. The pins are still pinned; nothing checks that they travel.
#   * A DISCOVERY channel for platform-specific behaviour. Three defects in this tree cite the macOS
#     leg, and they were checked one at a time rather than counted, because counting them would have
#     overstated this:
#       - `packages/cli/src/index.ts`'s `ENOTCONN` — stdout a socket rather than a pipe — was
#         genuinely FOUND here and nowhere else. Its coverage survives: `process.test.ts` fires every
#         member of `BROKEN_PIPE_CODES` individually, written that way because *"a guard whose
#         coverage depends on which machine ran it is not a guard"*. What is lost is finding an
#         unknown fourth code, not the three that are known.
#       - `dev/browserTierSite.test-helper.ts`'s `dist-web/` race was reported by BOTH legs on the
#         same commit, macOS as `net::ERR_HTTP_RESPONSE_CODE_FAILURE` and linux as a missing heading.
#         One leg would have caught it.
#       - `everyday/viewportGates.browser.test.ts`'s pinned offset was found by the two legs agreeing
#         with each other and disagreeing with a local machine. That is CI-versus-local, not
#         macOS-versus-linux, and one leg plus a developer's machine still produces it.
#     So the honest loss is the first bullet's second half and this one's: no second platform is
#     watching, and nothing will surface a defect that only appears on one.
#
# Re-adding a leg is one `include:` entry. If the cost was the objection rather than the coverage, a
# macOS job restricted to `packages/cli` would buy back the only finding that was uniquely this
# leg's for a fraction of a full suite; nobody has been asked for that and it is not assumed here.
#
# Node is pinned to a single version ON PURPOSE. Both § D196 and the § D201 measurement independently
# found the digests bit-identical across Node versions (22 vs 26, and 26.5.0 vs 26.5.1), so a Node
# axis would spend runner minutes re-confirming the one variable already eliminated while leaving the
# one that has never been isolated — the platform — untested.
#
# Both legs are GitHub-hosted, and both runner labels are literals in this file. The self-hosted
# Azure runner pool that used to sit behind a `CI_LINUX_RUNNER_LABEL` repository variable has been
# removed — template, runbook and workflow guard — so there is no way to retarget a leg without
# editing this file, which is the point.
#
# The matrix still identifies a leg by `platform` (`linux`/`macos`) and names its runner separately,
# so the job names — and therefore any required-status-check names — are stable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue batches several approved pull requests and tests the tree they WOULD produce
  # together. That is the only mechanism here that makes the full suite cheaper per pull request
  # rather than merely faster, because N branches cost one run instead of N. Nothing is required to
  # use it; the trigger existing is what lets the repository turn one on without another edit here.
  merge_group:
  workflow_dispatch:

# **Cancelling is right for one of these three event kinds and wrong for the other two**, and this
# file used to treat them the same.
#
# A pull request's own iterations supersede each other: push again and the older run is answering a
# question nobody is asking, while holding a runner other branches want. Cancelling there protects
# the shared pool, which is what lets several branches make progress at once.
#
# `main` and `merge_group` are the opposite. Those runs ARE the record, and a cancelled run is not a
# result at all: it is neither a pass nor a failure, and filing it as either is the mistake. Measured
# on 2026-09-04, when this group cancelled ten of twelve runs on one branch and the only green suite
# in the whole session was on a documentation-only commit. `RISKS.md` R46 carries that, together with
# the notification shape that reports a cancelled head as clear.
#
# The group keys on the pull request NUMBER rather than `github.ref`, because `refs/pull/N/merge` and
# a later `refs/heads/...` push for the same branch would otherwise land in different groups.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # **One leg per vitest project, run concurrently.** This was a single job running `npm test`, which
  # is every project in series: 49 minutes on the one run that completed on 2026-09-04.
  #
  # The arithmetic that decides it was measured on that run rather than estimated. Setup is
  # **35 seconds** end to end (checkout 3 s, setup-node 7 s, `npm ci` 2 s, `npm run build` 4 s,
  # Chromium 20 s) against a suite of ~49 minutes. So paying setup five times costs about three
  # extra runner-minutes and returns the wall clock of the longest single project instead of the sum
  # of all of them. Roughly a fifth more runner time for something between a two and a threefold
  # improvement in how long a branch waits.
  #
  # **Nothing is skipped and no change-detection is involved**, which is deliberate. A mapping from
  # changed paths to affected projects is the obvious next lever and it is NOT taken here: a wrong
  # mapping skips a project silently, and a gate that does not gate is this repository's
  # most-repeated defect (`RISKS.md` R40). Splitting buys most of the same wall clock and cannot lie
  # about coverage. If path filtering is wanted later it belongs behind the merge queue, where a
  # wrong mapping costs a late red rather than a shipped defect.
  #
  # **`experiments` gets its own leg for a reason beyond speed.** Its long simulations are documented
  # as needing to run sequentially and never beside another suite; that constraint is about sharing
  # one machine, and separate legs are separate runners. So the split satisfies it rather than
  # straining it, and the integrator who ran `experiments` next to `viz` on one container and got
  # nothing back in fifty minutes is why this sentence is here.
  legs:
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    # Stated rather than inherited. The suite reads the tree and writes nothing, so the token this
    # job hands to whatever a pull request contains is the smallest one that still checks out.
    permissions:
      contents: read
    strategy:
      # Kept `false` on a one-leg matrix, which changes nothing today and is the right default the
      # moment a second leg comes back: `fail-fast: true` would cancel the second the instant the
      # first went red, and "does this pin hold on both platforms?" is unanswerable if one leg is
      # cancelled for being slow.
      fail-fast: false
      matrix:
        # Still an explicit `include:` rather than a free `os:` axis, and still for the same reason
        # with one entry as with two: every leg is named in one place. A free axis multiplies legs
        # out of its sight, which is how a Node axis would come back.
        include:
          - leg: core
            projects: --project core
            platform: linux
            runner: ubuntu-latest
          - leg: viz
            projects: --project viz
            platform: linux
            runner: ubuntu-latest
          - leg: experiments
            projects: --project experiments
            platform: linux
            runner: ubuntu-latest
          - leg: service
            projects: --project server --project cli
            platform: linux
            runner: ubuntu-latest
          - leg: browser
            projects: --project viz-browser
            browser: true
            platform: linux
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor package.json declares. Kept as one value — see the header on why there is no
          # Node axis.
          node-version: '26'
          cache: npm

      - name: Record the environment the pins are being judged against
        # Printed before anything can fail, because when a pin splits the matrix this block is the
        # first thing a reader needs and the last thing a failed run would otherwise show. § D201's
        # standing rule is that a run is a machine and not only a commit, so the runner's own name
        # and architecture are recorded here rather than assumed.
        run: |
          echo "platform    : ${{ matrix.platform }}"
          echo "runner label: ${{ matrix.runner }}"
          echo "runner name : ${{ runner.name }}"
          echo "runner arch : $(uname -m)"
          echo "kernel      : $(uname -sr)"
          echo "node        : $(node --version)"
          echo "npm         : $(npm --version)"

      - name: The Linux leg is x86-64, or it is a second pin environment
        # The `if:` is gone with the second leg — every leg is Linux now, so a condition naming the
        # platform would be a guard that cannot fail, which is this repository's most-repeated
        # defect. It comes back with the leg.
        #
        # Contract § 0.2. `ubuntu-latest` is x86-64 today, and a Linux leg that is not would not be
        # a cheaper version of this one — it would be a second platform whose pin set nobody has
        # measured, and since § D462 it would be the ONLY environment, which makes this step the
        # last thing standing between the pins and a silent change of machine. § D201 found the § D196 pins EXACTLY INVERTED between Linux and darwin/arm64,
        # 26 failing and the 26 they superseded passing, so a silent architecture swap here would
        # reproduce that investigation from scratch. Kept after the self-hosted pool was removed
        # because the thing it guards is GitHub changing what `ubuntu-latest` means, which is not
        # this repository's decision to make either. Failing loudly costs one red run.
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error title=The Linux leg is not x86-64::runner '${{ runner.name }}' reports $arch. docs/15-compute-offload-contract.md § 0.2 requires the Linux leg to be x86-64; an ARM leg is a separate decision with its own measurement."
            exit 1
          fi

      - run: npm ci

      # Before the suite: packages/cli/src/process.test.ts spawns the built CLI from dist/ and only
      # rebuilds it when it is *missing*, not when it is stale — a stale dist/ produced 5 spurious
      # failures during the § D201 investigation. Building first makes that class of failure
      # impossible rather than merely unlikely, and typechecking is a gate worth having regardless.
      - name: Typecheck and build
        run: npm run build

      # ── The browser tier ────────────────────────────────────────────────────
      #
      # Until GitHub issue #142 the `viz-browser` project ran NOWHERE. It is gated on
      # `ELEVATOR_SIM_CHROMIUM`, this file named neither that variable nor Playwright, and the
      # variable is unset by default on a developer's machine too — so thirty-eight cases skipped in
      # both places they could have run, and a skip is indistinguishable from a pass in the summary
      # line. Pointed at a local shell and run directly it came back 3 files and 8 tests red, and
      # nobody could date it.
      #
      # **The rule is unconditional, and § D462 did not touch that.** This block used to argue for
      # a browser on *both* legs: a one-leg tier would need `packages/viz/src/dev/browserTier.test.ts`
      # to carry a per-leg exemption, and an exemption is where this class of problem goes to be
      # forgotten (`dispatch/deadCode.test.ts` says the same about its own allowlist). Read that
      # argument precisely — it is about a browser on SOME legs and not others. With one leg there
      # is nothing to exempt, so the rule stands exactly as written and needs no change: in CI, a
      # gated tier that would skip is a red run. The tier is ~157 s against a suite that runs for
      # ~40 minutes.
      #
      # Since GitHub issue #281 the tier serves the artifact this repository actually ships —
      # `dist-web/`, built once by the `viz-browser` project's own globalSetup — rather than a
      # `vite dev` server. That adds one `vite build` per run and removes 29 dev-server startups,
      # and it is cheaper rather than dearer — measured on a 4-core container over five runs, three
      # quiet (186.6 s, 199.3 s, 183.1 s) and two under eight extra CPU spinners (253.2 s, 249.8 s),
      # against 268.98 s before. So this step needs no change, and nothing has to be built here for
      # it: the `npm run build` step above is already required, for the reason stated below.
      #
      # The download is Playwright's own, by `playwright-core` — already a devDependency, so no new
      # package — and the path is read back from `chromium.executablePath()` rather than assembled
      # from a revision number, because pinning `chromium_headless_shell-1228` here would go stale
      # on the next Playwright bump with the tier silently skipping again, which is the whole defect.
      # `--with-deps` is what installs the shared libraries the Linux runner does not ship; it is a
      # no-op on macOS.
      #
      # This sits after `npm run build` deliberately: the browser tier serves the viewer through
      # Vite, `packages/viz` imports `@elevator-sim/core/browser`, and that subpath resolves through
      # `packages/core/dist`. On a tree that has never been built, every page in the tier loads with
      # `Failed to resolve import` and draws nothing — measured while reproducing #142, where it
      # turned 8 real failures into 14 misleading ones.
      - name: Install the Chromium the browser tier drives
        # **Every leg, not only the browser one, and the first version of this file got that wrong.**
        #
        # `packages/viz/src/dev/browserTier.test.ts` lives in the `viz` project and its whole purpose
        # is to fail a CI run in which the browser tier WOULD skip. Gating this step on
        # `matrix.browser` left the `viz` leg running that assertion with no Chromium on the machine,
        # and it fired exactly as written: *"this is CI and the browser tier would skip: viz-browser
        # (36 files)"*. 217 files passed and that one turned the leg red.
        #
        # The guard says what to do about it in its own failure text — *"if that step was removed,
        # restore it rather than relaxing this check"* — so the step is restored on every leg rather
        # than the check being scoped to the leg that happens to select the tier. Twenty seconds a
        # leg, about eighty seconds of runner time in total, to keep a guard that has already earned
        # its keep once: GitHub issue #142 is thirty-eight cases that skipped in both places they
        # could have run, and a skip is indistinguishable from a pass in the summary line.
        #
        # Recorded rather than quietly patched, because it is the split's first real finding: cutting
        # one job into five cut a precondition the single job satisfied for everything at once.
        run: npx playwright-core install --with-deps chromium

      - name: Point the browser tier at it
        # Also every leg, for the reason above: the variable is what `browserTier.test.ts` reads.
        run: |
          shell="$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath());")"
          if [ ! -x "$shell" ]; then
            echo "::error title=No Chromium for the viz-browser tier::playwright-core reports '$shell', which is not executable. The tier would skip, and packages/viz/src/dev/browserTier.test.ts will fail the run rather than let it."
            exit 1
          fi
          echo "browser tier: $shell"
          echo "ELEVATOR_SIM_CHROMIUM=$shell" >> "$GITHUB_ENV"

      - name: Test suite
        # This leg's projects, named by the matrix. `viz-browser` is registered in `vitest.config.ts`
        # and gated on the variable the browser leg exports, so it runs on that leg and skips
        # nowhere else by construction rather than by a flag.
        #
        # **`--passWithNoTests=false` is load-bearing and not decoration.** Every project in
        # `vitest.config.ts` sets `passWithNoTests: true`, which is right for a package whose phase
        # has not landed and wrong for a command that selects by name: a typo in `projects` above
        # would otherwise exit 0 having executed nothing, and in the Actions tab that is
        # indistinguishable from a job whose tests passed. That is `RISKS.md` R40's second half, and
        # splitting one command into five is exactly the change that makes it reachable.
        run: npx vitest run ${{ matrix.projects }} --passWithNoTests=false

  # The single check a branch protection rule can point at, and the reason the leg names above are
  # free to change. `suite (linux)` was one job and is now five, so a required status check naming it
  # would have gone looking for a job that no longer exists. This job keeps that name, depends on
  # every leg, and fails unless all of them succeeded.
  #
  # `if: always()` so that a cancelled or failed leg still produces a verdict here rather than
  # leaving the check pending forever, and the body treats anything other than `success` as a
  # failure — a cancelled leg included, because a cancelled run is not a pass.
  suite:
    name: suite (linux)
    needs: legs
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every leg is green, or this check is not
        run: |
          result='${{ needs.legs.result }}'
          echo "legs: $result"
          if [ "$result" != "success" ]; then
            echo "::error title=A suite leg did not pass::the legs job reports '$result'. A cancelled leg counts as a failure here on purpose: a cancelled run is neither a pass nor a failure, and this check may only be green on a run that finished."
            exit 1
          fi
