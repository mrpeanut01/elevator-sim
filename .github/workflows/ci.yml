# The environment this repository's results are true of, made explicit.
#
# This repository pins whole-result digests (`core/src/traffic/*Identity.test.ts`) and published
# statistical figures (`experiments/src/benchmark/published.ts`) as exact values. A pin like that is
# a claim about a *machine* as much as about the code, and until this file existed nothing recorded
# which machine. DECISIONS.md § D196 re-pinned 26 values that failed in one environment; the same 26
# then failed in another, in the opposite direction, with each environment reproducing its own pin
# set exactly (§ D201). Both measurements were correct. Neither was portable, and no gate noticed,
# because there was no CI.
#
# So the matrix is deliberately two operating systems rather than one. A single runner would restore
# the status quo — one environment silently canonical, its pins indistinguishable from portable ones.
# Running both makes portability a measured property: a pin that holds on both is portable, and a
# pin that splits the matrix is an environment-dependent oracle wearing an equality assertion, which
# is the defect § D201 names.
#
# Node is pinned to a single version ON PURPOSE. Both § D196 and the § D201 measurement independently
# found the digests bit-identical across Node versions (22 vs 26, and 26.5.0 vs 26.5.1), so a Node
# axis would spend runner minutes re-confirming the one variable already eliminated while leaving the
# one that has never been isolated — the platform — untested.
#
# ## The Linux leg can move to hardware the project owner controls, and by default it has not
#
# `docs/15-compute-offload-contract.md` § 2 puts the Linux leg on self-hosted runners sized for this
# workload. The switch is the repository variable `CI_LINUX_RUNNER_LABEL`, and **unset is the
# shipped state**: with no variable set, `${{ vars.CI_LINUX_RUNNER_LABEL || 'ubuntu-latest' }}`
# resolves to `ubuntu-latest` and this workflow does exactly what it did before, on the runners it
# did it on. Nothing queues for a runner that does not exist, because nothing asks for one.
#
# Two things the variable deliberately cannot do, both asserted by the `matrix shape` job below
# against this file:
#
#   * It cannot touch the macOS leg. `macos-latest` is a literal here. Azure has no macOS, the
#     matrix exists to compare two platforms, and a configurable second leg is precisely how one
#     leg comes to be standing alone.
#   * It cannot point the Linux leg at a different architecture without the run saying so. Per the
#     contract § 0.2, an Ampere/ARM runner is a THIRD pin environment, not a cheaper x86 one —
#     § D201 found the § D196 pin set exactly inverted between Linux and darwin/arm64. The
#     architecture check below fails the leg rather than quietly producing a third pin set.
#
# The matrix identifies a leg by `platform` (`linux`/`macos`) and names its runner separately, so
# the job names — and therefore any required-status-check names — are the same whether the offload
# is on or off.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads this file and asserts that it still describes a two-platform comparison, and that the
  # Linux leg's default is still `ubuntu-latest`. Pinned to a GitHub-hosted runner on purpose: its
  # whole subject is whether the self-hosted switch has eaten a leg, and a guard that runs on the
  # fleet it is guarding cannot report that the fleet is missing.
  #
  # No `npm ci` — the guard uses `node:test`, `node:assert` and `node:fs` and nothing installed,
  # matching review.yml's `gates` job, so it cannot fail for a reason unrelated to what it checks.
  matrix-shape:
    name: matrix shape
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: The matrix still compares two operating systems
        run: node --test 'infra/checks/*.test.mjs'

  suite:
    name: suite (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Stated rather than inherited. The suite reads the tree and writes nothing, and once the Linux
    # leg can run on hardware the owner pays for, the token this job hands to whatever a pull
    # request contains should be the smallest one that still checks out. See infra/README.md § 9 on
    # fork pull requests, which is the risk this narrows and does not close.
    permissions:
      contents: read
    strategy:
      # Both legs always run. `fail-fast: true` would cancel the second the moment the first went
      # red, which would destroy exactly the comparison this matrix exists to make: "does this pin
      # hold on both platforms?" is unanswerable if one leg is cancelled for being slow.
      fail-fast: false
      matrix:
        # Written out as an explicit `include:` rather than a free `os:` axis so that every leg is
        # named in one place and the guard can read them. A free axis multiplies legs out of its
        # sight, which is how a Node axis would come back.
        include:
          - platform: linux
            runner: ${{ vars.CI_LINUX_RUNNER_LABEL || 'ubuntu-latest' }}
          - platform: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor package.json declares. Kept as one value — see the header on why there is no
          # Node axis.
          node-version: '26'
          cache: npm

      - name: Record the environment the pins are being judged against
        # Printed before anything can fail, because when a pin splits the matrix this block is the
        # first thing a reader needs and the last thing a failed run would otherwise show. § D201's
        # standing rule is that a run is a machine and not only a commit, so the runner's own name
        # is here too: on a self-hosted leg it is the only thing that says which VM answered.
        run: |
          echo "platform    : ${{ matrix.platform }}"
          echo "runner label: ${{ matrix.runner }}"
          echo "runner name : ${{ runner.name }}"
          echo "runner arch : $(uname -m)"
          echo "kernel      : $(uname -sr)"
          echo "node        : $(node --version)"
          echo "npm         : $(npm --version)"

      - name: The Linux leg is x86-64, or it is a third pin environment
        if: matrix.platform == 'linux'
        # Contract § 0.2. `ubuntu-latest` is x86-64, and a self-hosted pool that is not would not
        # be a cheaper version of this leg — it would be a third platform whose pin set nobody has
        # measured. § D201 found the § D196 pins EXACTLY INVERTED between Linux and darwin/arm64,
        # 26 failing and the 26 they superseded passing, so a silent architecture swap here would
        # reproduce that investigation from scratch. Failing loudly costs one red run; not failing
        # costs a wave.
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error title=The Linux leg is not x86-64::runner '${{ runner.name }}' reports $arch. docs/15-compute-offload-contract.md § 0.2 requires the self-hosted Linux pool to match ubuntu-latest; an ARM pool is a separate decision with its own measurement. Unset CI_LINUX_RUNNER_LABEL to fall back to ubuntu-latest."
            exit 1
          fi

      - run: npm ci

      # Before the suite: packages/cli/src/process.test.ts spawns the built CLI from dist/ and only
      # rebuilds it when it is *missing*, not when it is stale — a stale dist/ produced 5 spurious
      # failures during the § D201 investigation. Building first makes that class of failure
      # impossible rather than merely unlikely, and typechecking is a gate worth having regardless.
      - name: Typecheck and build
        run: npm run build

      - name: Test suite
        run: npm test
