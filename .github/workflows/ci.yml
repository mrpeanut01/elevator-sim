# The environment this repository's results are true of, made explicit.
#
# This repository pins whole-result digests (`core/src/traffic/*Identity.test.ts`) and published
# statistical figures (`experiments/src/benchmark/published.ts`) as exact values. A pin like that is
# a claim about a *machine* as much as about the code, and until this file existed nothing recorded
# which machine. DECISIONS.md § D196 re-pinned 26 values that failed in one environment; the same 26
# then failed in another, in the opposite direction, with each environment reproducing its own pin
# set exactly (§ D201). Both measurements were correct. Neither was portable, and no gate noticed,
# because there was no CI.
#
# So the matrix is deliberately two operating systems rather than one. A single runner would restore
# the status quo — one environment silently canonical, its pins indistinguishable from portable ones.
# Running both makes portability a measured property: a pin that holds on both is portable, and a
# pin that splits the matrix is an environment-dependent oracle wearing an equality assertion, which
# is the defect § D201 names.
#
# Node is pinned to a single version ON PURPOSE. Both § D196 and the § D201 measurement independently
# found the digests bit-identical across Node versions (22 vs 26, and 26.5.0 vs 26.5.1), so a Node
# axis would spend runner minutes re-confirming the one variable already eliminated while leaving the
# one that has never been isolated — the platform — untested.
#
# Both legs are GitHub-hosted, and both runner labels are literals in this file. The self-hosted
# Azure runner pool that used to sit behind a `CI_LINUX_RUNNER_LABEL` repository variable has been
# removed — template, runbook and workflow guard — so there is no way to retarget a leg without
# editing this file, which is the point.
#
# The matrix still identifies a leg by `platform` (`linux`/`macos`) and names its runner separately,
# so the job names — and therefore any required-status-check names — are stable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Stated rather than inherited. The suite reads the tree and writes nothing, so the token this
    # job hands to whatever a pull request contains is the smallest one that still checks out.
    permissions:
      contents: read
    strategy:
      # Both legs always run. `fail-fast: true` would cancel the second the moment the first went
      # red, which would destroy exactly the comparison this matrix exists to make: "does this pin
      # hold on both platforms?" is unanswerable if one leg is cancelled for being slow.
      fail-fast: false
      matrix:
        # Written out as an explicit `include:` rather than a free `os:` axis so that every leg is
        # named in one place and the guard can read them. A free axis multiplies legs out of its
        # sight, which is how a Node axis would come back.
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor package.json declares. Kept as one value — see the header on why there is no
          # Node axis.
          node-version: '26'
          cache: npm

      - name: Record the environment the pins are being judged against
        # Printed before anything can fail, because when a pin splits the matrix this block is the
        # first thing a reader needs and the last thing a failed run would otherwise show. § D201's
        # standing rule is that a run is a machine and not only a commit, so the runner's own name
        # and architecture are recorded here rather than assumed.
        run: |
          echo "platform    : ${{ matrix.platform }}"
          echo "runner label: ${{ matrix.runner }}"
          echo "runner name : ${{ runner.name }}"
          echo "runner arch : $(uname -m)"
          echo "kernel      : $(uname -sr)"
          echo "node        : $(node --version)"
          echo "npm         : $(npm --version)"

      - name: The Linux leg is x86-64, or it is a third pin environment
        if: matrix.platform == 'linux'
        # Contract § 0.2. `ubuntu-latest` is x86-64 today, and a Linux leg that is not would not be
        # a cheaper version of this one — it would be a third platform whose pin set nobody has
        # measured. § D201 found the § D196 pins EXACTLY INVERTED between Linux and darwin/arm64,
        # 26 failing and the 26 they superseded passing, so a silent architecture swap here would
        # reproduce that investigation from scratch. Kept after the self-hosted pool was removed
        # because the thing it guards is GitHub changing what `ubuntu-latest` means, which is not
        # this repository's decision to make either. Failing loudly costs one red run.
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error title=The Linux leg is not x86-64::runner '${{ runner.name }}' reports $arch. docs/15-compute-offload-contract.md § 0.2 requires the Linux leg to be x86-64; an ARM leg is a separate decision with its own measurement."
            exit 1
          fi

      - run: npm ci

      # Before the suite: packages/cli/src/process.test.ts spawns the built CLI from dist/ and only
      # rebuilds it when it is *missing*, not when it is stale — a stale dist/ produced 5 spurious
      # failures during the § D201 investigation. Building first makes that class of failure
      # impossible rather than merely unlikely, and typechecking is a gate worth having regardless.
      - name: Typecheck and build
        run: npm run build

      # ── The browser tier ────────────────────────────────────────────────────
      #
      # Until GitHub issue #142 the `viz-browser` project ran NOWHERE. It is gated on
      # `ELEVATOR_SIM_CHROMIUM`, this file named neither that variable nor Playwright, and the
      # variable is unset by default on a developer's machine too — so thirty-eight cases skipped in
      # both places they could have run, and a skip is indistinguishable from a pass in the summary
      # line. Pointed at a local shell and run directly it came back 3 files and 8 tests red, and
      # nobody could date it.
      #
      # **Both legs, not one.** The issue asked for "at least one platform" and one leg would have
      # been cheaper — but a one-leg tier needs the guard in
      # `packages/viz/src/dev/browserTier.test.ts` to carry a per-leg exemption, and an exemption is
      # where this class of problem goes to be forgotten (`dispatch/deadCode.test.ts` says the same
      # thing about its own allowlist). With a browser on both legs the rule is unconditional: in
      # CI, a gated tier that would skip is a red run. The tier is ~157 s against a suite that runs
      # for ~40 minutes.
      #
      # The download is Playwright's own, by `playwright-core` — already a devDependency, so no new
      # package — and the path is read back from `chromium.executablePath()` rather than assembled
      # from a revision number, because pinning `chromium_headless_shell-1228` here would go stale
      # on the next Playwright bump with the tier silently skipping again, which is the whole defect.
      # `--with-deps` is what installs the shared libraries the Linux runner does not ship; it is a
      # no-op on macOS.
      #
      # This sits after `npm run build` deliberately: the browser tier serves the viewer through
      # Vite, `packages/viz` imports `@elevator-sim/core/browser`, and that subpath resolves through
      # `packages/core/dist`. On a tree that has never been built, every page in the tier loads with
      # `Failed to resolve import` and draws nothing — measured while reproducing #142, where it
      # turned 8 real failures into 14 misleading ones.
      - name: Install the Chromium the browser tier drives
        run: npx playwright-core install --with-deps chromium

      - name: Point the browser tier at it
        run: |
          shell="$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath());")"
          if [ ! -x "$shell" ]; then
            echo "::error title=No Chromium for the viz-browser tier::playwright-core reports '$shell', which is not executable. The tier would skip, and packages/viz/src/dev/browserTier.test.ts will fail the run rather than let it."
            exit 1
          fi
          echo "browser tier: $shell"
          echo "ELEVATOR_SIM_CHROMIUM=$shell" >> "$GITHUB_ENV"

      - name: Test suite
        # Every registered project, `viz-browser` included — it is registered in `vitest.config.ts`
        # and gated on the variable the step above exported, so no extra invocation is needed and
        # none should be added: a second command is a second place for the tier to be dropped from.
        run: npm test
