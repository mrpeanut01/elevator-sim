# Publish the viewer to Azure Static Web Apps.
#
# The runbook, the priced platform comparison and the limitations are
# `docs/16-static-site-deployment.md`. Read § 6 before arming this on a public repository.
#
# ## Why the page moves and the API does not
#
# `serve.ts` serves everything outside `/api/` from the bundle **in the same container**, and that
# container runs at `minReplicas: 0`. Measured on the live deployment: a cold first page load is
# **32.2 s**, warm is **0.13 s**. `GET /api/wake` fixes the API's cold start and cannot fix this
# one, because the page is the thing being waited on — there is no app on screen yet to apologise.
# So the page goes to a CDN and the API stays where it is. § D257.
#
# ## This is armed — it was not, and this paragraph said so for as long as that was true
#
# Every deploying job is guarded by `if: vars.AZURE_SWA_NAME != ''`. **That variable is now set**
# (2026-08-08), so the deploying jobs run. Unset, this workflow still runs on every push and pull
# request, still builds the site, still asserts the artifact, and deploys nothing — which is why
# `gh variable delete AZURE_SWA_NAME` is a complete rollback rather than half of one.
#
# The split is still deliberate and is still the shape `infra/README.md` § 0 uses: the useful half
# ran from the first commit, the half that touches an external system waited for a human. It also
# means the build was exercised on every pull request from the day this landed, so the deploy path
# could not rot unnoticed while unarmed — the failure mode a `workflow_dispatch`-only deploy job
# would have had. What it did *not* protect against is the deploy path being wrong in a way only a
# real token exchange can show, and it was, twice (§ D308).
#
# Arm it:    ./infra/azure/swa/provision.sh          (sets six variables, in an enforced order)
# Disarm it: gh variable delete AZURE_SWA_NAME       (instant, and this is the rollback)
#
# ## Three values have to agree, and this file holds one of them
#
# A statically hosted page carries no server, so it has to be **told at build time** where the API
# is — `<meta name="elevator-sim-api">`, from `vars.ELEVATOR_SIM_API_ORIGIN`. The other two are on
# the API: `ELEVATOR_SIM_ORIGIN` (where sign-in links point) and `ELEVATOR_SIM_ALLOW_ORIGIN` (who
# may call it from a browser), both set from the app template's one `viewerOrigin` parameter.
#
# Getting the first one wrong is the expensive mistake and it is **silent**: the site loads, draws,
# and every account, leaderboard and challenge surface dead-ends with no failing status code
# anywhere. That is not a hypothesis — it shipped, and it is play-tester issues #21, #28, #29, #30,
# #32 and #34 (§ D243). So it is checked three times over: the build refuses to run armed without
# it, the artifact is asserted **in both directions**, and `provision.sh --deploy-now` reads the tag
# back off the deployed page.
#
# ## There is no secret in this repository
#
# Authentication is a GitHub OIDC token exchanged for an Azure one against a federated credential
# on a user-assigned managed identity (`infra/azure/swa/main.bicep`). No `AZURE_CREDENTIALS`, no
# client secret, and — the part that is not the default for Static Web Apps — no stored deployment
# token either.
#
# `Azure/static-web-apps-deploy@v1` cannot use a federated credential (Azure/static-web-apps#1304,
# open since 2023); it takes a deployment token and only a deployment token. The usual answer is to
# paste that token into a repository secret, where it sits, long-lived, valid until someone
# remembers to rotate it. Instead the token is *fetched* at run time with the OIDC identity, whose
# entire permission is to read it, and passed to the action through a masked step output. It exists
# for the length of one job. Rotating it is a no-op here and revocation is deleting one federated
# credential in Azure — neither requires touching this repository.
#
# The residual exposure is stated rather than implied: for the seconds it is in flight the token is
# in the job's memory and in the action's container environment. Anything that can execute in that
# job can read it. That is a smaller window than a stored secret and it is not zero, and the control
# that actually matters for the fork case is the repository setting named in `docs/16` § 6.

name: Deploy viewer

on:
  push:
    branches: [main]
    # The site is `packages/viz` plus the reference data it copies at build time plus the workspace
    # it imports. A docs-only commit does not change a byte of the artifact, and deploying one
    # would burn a preview environment and a deployment for nothing.
    paths:
      - 'packages/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-viz.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'packages/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-viz.yml'
  workflow_dispatch:

concurrency:
  # Production is its own group, named literally. Pull requests get one group each, named by number.
  #
  # This used to be `deploy-viz-${{ github.ref }}` with the same `cancel-in-progress` expression, and
  # the intent was right — a half-uploaded site is worse than a slightly stale one, so production is
  # never cancelled mid-flight, while a superseded preview is. **The mechanism did not deliver it**,
  # and merging pull request #131 is the run that proved it:
  #
  #   02:07:15  Deploy viewer  integration/issue-wave-15  pull_request(closed)  success
  #   02:07:15  Deploy viewer  main                       push                  CANCELLED  (+2 s)
  #
  # Two seconds, no job started. `cancel-in-progress` is read from the **arriving** run, not from the
  # one being cancelled — so a `pull_request` run, which sets it `true`, cancels whatever it shares a
  # group with, and the push's own `false` protects nothing. The guard assumed both runs in a group
  # would be the same event, and on a merge they are not.
  #
  # The consequence is the part worth remembering: **merging a pull request silently skipped the
  # production deploy.** The merge was green, the PR closed cleanly, the site stayed on the previous
  # wave, and the only evidence was a cancelled run nobody had a reason to open. It was found by
  # grepping the deployed bundle for a string the merge was supposed to have added.
  #
  # Naming the groups by *purpose* rather than by ref makes the collision impossible rather than
  # unlikely: a preview can only ever cancel its own preview.
  group: >-
    deploy-viz-${{
      github.event_name == 'pull_request'
        && format('pr-{0}', github.event.number)
        || 'production'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build. Runs always, arms nothing, and is the reason this file is useful unarmed.
  # ---------------------------------------------------------------------------
  build:
    name: build site
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor package.json declares, and the same single value ci.yml pins. This job makes
          # no measurement, so it needs no matrix — but it must not disagree with the suite about
          # which Node the tree is built with.
          node-version: '26'
          cache: npm

      - run: npm ci

      # `tsc -b` first, and not as a formality: `@elevator-sim/core`'s exports map resolves the
      # browser condition to `./dist/browser.js`, so Vite has nothing to bundle until the workspace
      # has been compiled. Skipping this fails at resolution with a message about a missing file
      # rather than about a missing build.
      - name: Compile the workspace
        run: npm run build

      - name: Build the static site
        env:
          # Empty when unarmed, which produces a bundle with no tag — identical to what the
          # container image builds, and correct for it. Set since 2026-08-08; the unarmed branch is
          # still exercised by every fork pull request, so it is live code rather than a fallback.
          ELEVATOR_SIM_API_ORIGIN: ${{ vars.ELEVATOR_SIM_API_ORIGIN }}
          # The switch that turns absence into a failure. Absence is *correct* for the container and
          # catastrophic for a CDN, and only this file knows which build this is — so it says. Armed
          # with no origin, the build stops here with a message naming the six issues, rather than
          # producing a site that loads and does nothing.
          ELEVATOR_SIM_API_ORIGIN_REQUIRED: ${{ vars.AZURE_SWA_NAME != '' }}
        run: npm run build:web -w @elevator-sim/viz

      # Proves the emitter ran *in this build*, on this runner, against this checkout — the artifact
      # is checked rather than the configuration that produces it. Without `__buildings.json` the
      # site deploys, loads, and dies in `fetchJson`, which is a failure no HTTP status and no build
      # log would have reported.
      - name: The artifact is complete
        run: |
          cd packages/viz/dist-web
          for required in index.html __buildings.json staticwebapp.config.json \
                          elevator-specs.json traffic-profiles.json dispatcher-profiles.json \
                          campaign.json scenario-goals.json; do
            test -s "$required" || { echo "::error::$required missing or empty from the build output"; exit 1; }
          done
          # Every building in data/ reached the manifest. A silently shorter manifest is the
          # failure mode an explicit emitter can have and a directory copy cannot.
          on_disk=$(ls ../../../data/buildings/*.json | wc -l)
          in_manifest=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('__buildings.json','utf8')).files.length))")
          test "$on_disk" -eq "$in_manifest" || {
            echo "::error::data/ has $on_disk buildings, the manifest names $in_manifest"; exit 1; }
          echo "artifact complete: $in_manifest buildings, $(du -sh . | cut -f1) total"

      # The check this lane exists for, asserted in two directions: **armed against unarmed**. An
      # armed build must carry the tag and a `connect-src` that permits it; an unarmed build must
      # carry neither, because a bundle that acquired an origin without anyone asking is how the
      # container's own `"/"` injection gets silently suppressed (both producers are idempotent).
      #
      # That pair used to be described here as "asserted BOTH WAYS", which reads as though it also
      # covered **how many** origins `connect-src` names. It never did. For as long as the sentence
      # sat above it the armed arm admitted an arbitrary second origin, and the arm that runs on
      # every production deploy was the looser of the two (issue #341, § D471). The origin count is
      # a separate check now, below, and it is an equality rather than a substring.
      #
      # Comments are stripped before the match. `index.html` carries a comment naming this tag, to
      # tell the next reader not to write it by hand — and matching that comment is a bug that was
      # made here once already, by the commit that added the comment.
      - name: The page knows where the API is — or deliberately does not
        env:
          EXPECTED: ${{ vars.ELEVATOR_SIM_API_ORIGIN }}
        run: |
          cd packages/viz/dist-web
          declared=$(node -e "
            const html = require('fs').readFileSync('index.html','utf8').replace(/<!--[\s\S]*?-->/gu,'');
            const m = /<meta[^>]*name=[\"']elevator-sim-api[\"'][^>]*content=[\"']([^\"']*)/u.exec(html);
            process.stdout.write(m ? m[1] : '');
          ")
          csp=$(node -e "
            const c = JSON.parse(require('fs').readFileSync('staticwebapp.config.json','utf8'));
            process.stdout.write(c.globalHeaders['Content-Security-Policy']);
          ")
          # `connect-src`'s source list, single-spaced — or empty when the policy names no such
          # directive, or names two of them. Both arms below compare this for **equality** against a
          # list written here, so the permitted origins are decided in this file rather than read
          # off whatever a build happened to emit.
          #
          # The substring test this replaces (`*"connect-src 'self' $EXPECTED"*`) matched any policy
          # that merely *contained* that text, so `connect-src 'self' <expected> <anything>;` passed.
          # Pinning the terminator instead — `*"connect-src 'self' $EXPECTED;"*` — was measured and
          # rejected: it stops the second origin and it also rejects a **correct** policy, because
          # this CSP carries no trailing semicolon and whichever directive is written last therefore
          # has none. `connect-src` is the sixth of eleven directives today, and
          # `packages/server/src/http/static.test.ts` asserts the semicolon after it in both the
          # committed and the widened form, so the pinned form would pass now and break on a
          # reorder that changed nothing about the policy. Splitting on `;` and comparing tokens does
          # not care where the directive sits.
          connect=$(node -e "
            const c = JSON.parse(require('fs').readFileSync('staticwebapp.config.json','utf8'));
            const policy = c.globalHeaders['Content-Security-Policy'] || '';
            const found = policy
              .split(';')
              .map((d) => d.trim().split(/\s+/u).filter(Boolean))
              .filter((t) => t.length > 0 && t[0].toLowerCase() === 'connect-src');
            process.stdout.write(found.length === 1 ? found[0].slice(1).join(' ') : '');
          ")
          if [ -n "$EXPECTED" ]; then
            test "$declared" = "$EXPECTED" || {
              echo "::error::the built page declares '$declared', expected '$EXPECTED'. A page that"
              echo "::error::names no API loads, draws, and dead-ends every account, leaderboard and"
              echo "::error::challenge surface with no failing status code anywhere (issues #21, #28,"
              echo "::error::#29, #30, #32, #34). This is that failure, caught before it ships."
              exit 1; }
            # The allowlist. A second origin — an error-reporting endpoint, say (#242) — is added by
            # editing this line, which is a reviewable diff in the gate. It is deliberately not
            # something a config can acquire on its own.
            permitted="'self' $EXPECTED"
            test "$connect" = "$permitted" || {
              echo "::error::connect-src must permit exactly [$permitted] and permits [$connect]."
              echo "::error::An empty list there means the policy names no connect-src directive at"
              echo "::error::all, or names more than one. Either way the page cannot be trusted to"
              echo "::error::reach $EXPECTED and only $EXPECTED. The whole CSP: $csp"
              exit 1; }
            echo "armed: the page points at $EXPECTED and connect-src permits exactly [$permitted]"
          else
            test -z "$declared" || {
              echo "::error::unarmed, but the built page declares an API origin ('$declared')."
              echo "::error::That would suppress the server's own injection of '/' — the container"
              echo "::error::path is idempotent — and point the shipped image at somebody else."
              exit 1; }
            permitted="'self'"
            test "$connect" = "$permitted" || {
              echo "::error::unarmed, but connect-src permits [$connect] rather than exactly"
              echo "::error::[$permitted]. The whole CSP: $csp"
              exit 1; }
            echo "unarmed: no tag, connect-src permits exactly [$permitted] — identical to the container build"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: viz-site
          path: packages/viz/dist-web
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy. Skipped entirely until the repository variables exist.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: build
    if: >-
      github.event.action != 'closed' &&
      vars.AZURE_SWA_NAME != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # A pull request from a fork is excluded above by its head repository, and not as belt-and-
    # braces: GitHub does not issue an OIDC token to a workflow triggered by a fork's
    # `pull_request`, so this job cannot authenticate there and would fail on every external
    # contribution — a permanently red check that means nothing. Excluding it is what makes the
    # red legs honest. `docs/16` § 6 covers what to do if fork previews are actually wanted.
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token. The whole authentication story.
      contents: read
      # `pull-requests: write` was here for one thing — the preview URL comment
      # `Azure/static-web-apps-deploy` posts — and § D463 removed that comment, so the permission
      # went with it rather than being left as a grant nothing uses. The preview URL is still
      # published: `environment.url` below reads `steps.deploy.outputs.static_web_app_url`, so it
      # appears in the pull request's Deployments panel and on the environment itself.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'viz-preview' || 'viz-production' }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      # The artifact is what ships — this checkout is not built and not uploaded. It is here
      # because `Azure/static-web-apps-deploy` runs as a container action against the workspace
      # and is documented against workflows that have checked out; running it in a bare workspace
      # is untested ground for the sake of saving three seconds. `clean: true` is the default, so
      # this must come BEFORE the download or it would wipe it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: viz-site
          path: dist-web

      # None of these three is a secret. A client id, a tenant id and a subscription id are
      # identifiers, useless without the federated trust relationship that names this repository
      # and this branch. They are repository *variables* rather than secrets so that a reader of a
      # failed run can see which identity it tried to be — a masked value here buys nothing and
      # costs every future debugging session.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token with the federated identity
        id: token
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_SWA_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          # Masked BEFORE it is written anywhere. `add-mask` is what stops it appearing in this
          # log, in the next step's log, or in an error message from the action; the order matters
          # because a value echoed before being masked is already public.
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload to Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          # `repo_token` is deliberately absent — § D463. The action's own `action.yml` declares it
          # `required: false` and describes it as *"currently used only for commenting on Pull
          # Requests"*, so withholding it removes the comment and touches nothing else: the upload
          # still runs, the preview still deploys, and the URL still reaches the pull request
          # through `environment.url`. Checked against the action definition rather than assumed,
          # because a token removed on a guess would have failed the deploy instead of quieting it.
          action: upload
          # The site was built in the `build` job, from a lockfile install, on a pinned Node, and
          # its API origin was asserted there. Left to itself this action runs its own Oryx build
          # inside its own container with its own toolchain — a second build of the same commit that
          # nothing here controls, has ever tested, or would have given the API origin to.
          # `skip_app_build` makes the thing that was checked the thing that ships.
          skip_app_build: true
          skip_api_build: true
          app_location: dist-web
          # Empty, and deliberately: there is no API *here*. The API is a Container App in another
          # resource group, reached cross-origin — which is what the meta tag and CORS are for. A
          # linked backend would put it behind this hostname instead, at a Standard plan and about
          # £9/month; `docs/16` § 1 is why that was weighed and not taken.
          api_location: ''
          output_location: ''
          production_branch: main

      - name: Where it went
        run: |
          echo "url: ${{ steps.deploy.outputs.static_web_app_url }}"
          echo "its API: ${{ vars.ELEVATOR_SIM_API_ORIGIN }}"

  # ---------------------------------------------------------------------------
  # Tear down the preview when the pull request closes.
  # ---------------------------------------------------------------------------
  close-preview:
    name: close preview environment
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      vars.AZURE_SWA_NAME != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Required, and not for protection rules — this environment has none. The federated credential's
    # subject is `repo:OWNER/REPO:environment:NAME` (§ D308), and a job that declares no environment
    # presents the ref-based subject instead, which no credential now trusts. Without this line the
    # login below fails with AADSTS700213 on every pull request close, and the failure is a preview
    # environment that is never torn down — so the fourth open pull request hits a quota error
    # naming neither cause. It is the same environment this job is tearing down, so naming it here
    # is also the honest description of what the job touches.
    environment:
      name: viz-preview
    steps:
      # Free allows three concurrent preview environments. Without this job the fourth open pull
      # request fails to deploy with a quota error naming neither the three that are holding the
      # slots nor the fact that they belong to merged work. Closing them on `closed` — which fires
      # for merged pull requests too — is what keeps that quota a non-event.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token with the federated identity
        id: token
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_SWA_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: close
          app_location: .
